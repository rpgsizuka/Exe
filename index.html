<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>EXE MART | Shoe Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
header{
background:#111;color:#fff;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{font-size:22px;font-weight:bold;color:#00ffcc}
.cart-btn{
background:#00ffcc;
color:#000;
padding:8px 14px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}
.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.card{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
text-align:center;
}
.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}
.card h3{margin:10px 0}
.card p{color:green;font-weight:bold}
.card button{
margin-top:10px;
padding:8px 12px;
background:#111;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}
#cartBox{
position:fixed;
top:0;right:-100%;
width:320px;
height:100%;
background:#fff;
padding:20px;
box-shadow:-5px 0 10px rgba(0,0,0,0.2);
transition:0.3s;
overflow-y:auto;
}
#cartBox h2{text-align:center;margin-bottom:10px}
.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}
.total{
font-size:18px;
font-weight:bold;
margin-top:10px;
}
.pay{
margin-top:15px;
width:100%;
padding:10px;
background:#00ffcc;
border:none;
font-size:16px;
font-weight:bold;
cursor:pointer;
border-radius:5px;
}
.close{
text-align:right;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="logo">Exe Mart</div>
<div class="cart-btn" onclick="openCart()">Cart (<span id="count">0</span>)</div>
</header>

<div class="container">
<div class="card">
<img src="https://i.imgur.com/4ZQZ6hD.jpg">
<h3>Runner</h3>
<p>₹2499</p>
<button onclick="addToCart(' Runner',2499)">Add to Cart</button>
</div>

<div class="card">
<img src="https://i.imgur.com/9z8F4C7.jpg">
<h3>Pro</h3>
<p>₹2999</p>
<button onclick="addToCart(' Pro',2999)">Add to Cart</button>
</div>

<div class="card">
<img src="https://i.imgur.com/1zXGQYk.jpg">
<h3> Sport</h3>
<p>₹1999</p>
<button onclick="addToCart(' Sport shoe',1999)">Add to Cart</button>
</div>
</div>

<div id="cartBox">
<div class="close" onclick="closeCart()">X</div>
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
<button class="pay" onclick="payNow()">Pay Now</button>
</div>

<script>
let cart=[];
let total=0;

function addToCart(name,price){
cart.push({name,price});
total+=price;
document.getElementById("count").innerText=cart.length;
renderCart();
}

function renderCart(){
let items="";
cart.forEach(i=>{
items+=`<div class="cart-item"><span>${i.name}</span><span>₹${i.price}</span></div>`;
});
document.getElementById("cartItems").innerHTML=items;
document.getElementById("total").innerText=total;
}

function openCart(){
document.getElementById("cartBox").style.right="0";
}
function closeCart(){
document.getElementById("cartBox").style.right="-100%";
}
function payNow(){
;
}
</script>

</body>
</html>
